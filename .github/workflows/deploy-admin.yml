name: Deploy Admin to VPS

on:
  push:
    branches:
      - dev

jobs:
  # Job 1: Ensure nginx + SSL on VPS
  setup-nginx-if-missing:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure nginx config & SSL on VPS (if missing)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            DOMAIN="${{ secrets.ADMIN_DOMAIN }}"
            SSL_EMAIL="${{ secrets.SSL_EMAIL }}"
            SITE_CONF="/etc/nginx/sites-available/docimal-admin"
            FORCE_UPDATE="false"

            echo "Checking nginx config at $SITE_CONF ..."
            if [ -f "$SITE_CONF" ] && [ "$FORCE_UPDATE" != "true" ]; then
              echo "Nginx site config already exists — skipping creation."
              exit 0
            fi

            echo "Creating initial HTTP-only nginx config (for certbot webroot)..."
            cat > /etc/nginx/sites-available/docimal-admin << 'EOF'
            upstream admin_upstream {
                server 127.0.0.1:2999;
                keepalive 32;
            }
            server {
                listen 80;
                server_name DOMAIN_PLACEHOLDER;
                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }
                location / {
                    return 301 https://$server_name$request_uri;
                }
            }
            EOF

            sed -i "s/DOMAIN_PLACEHOLDER/$DOMAIN/g" /etc/nginx/sites-available/docimal-admin
            ln -sf /etc/nginx/sites-available/docimal-admin /etc/nginx/sites-enabled/
            mkdir -p /var/www/certbot
            nginx -t && systemctl reload nginx

            # Get cert if not exists
            if [ ! -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
              echo "Requesting certificate via certbot (webroot)..."
              certbot certonly --webroot -w /var/www/certbot -d "$DOMAIN" \
                --email "$SSL_EMAIL" --agree-tos --non-interactive || echo "certbot failed (but we continue)"
            fi

            if [ -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
              echo "Configuring nginx with SSL..."
              cat > /etc/nginx/sites-available/docimal-admin << EOF
            upstream admin_upstream {
                server 127.0.0.1:2999;
                keepalive 32;
            }

            server {
                listen 80;
                server_name $DOMAIN;
                return 301 https://\$server_name\$request_uri;
            }

            server {
                listen 443 ssl http2;
                server_name $DOMAIN;

                ssl_certificate /etc/letsencrypt/live/$DOMAIN/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/$DOMAIN/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;

                add_header Strict-Transport-Security "max-age=63072000" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;

                client_max_body_size 50M;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;

                location / {
                    proxy_pass http://admin_upstream;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
            EOF
              nginx -t && systemctl reload nginx
              echo "SSL + nginx configured for $DOMAIN"
            else
              echo "SSL not available yet for $DOMAIN"
            fi

  # Job 2: Build image, transfer and run container on VPS
  build-and-deploy:
    needs: setup-nginx-if-missing
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docimal-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create env file for Vite build
        run: |
          printf '%s\n' "${{ secrets.ADMIN_ENV }}" > .env.production
          chmod 600 .env.production

      - name: Build Docker image (local runner)
        run: |
          docker build --platform linux/amd64 -t $IMAGE_NAME:${{ github.sha }} .

      - name: Save image to tar
        run: |
          docker save $IMAGE_NAME:${{ github.sha }} -o ./image.tar

      - name: Copy image tar to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "./image.tar"
          target: "/tmp/"

      - name: Load and start container on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -euo pipefail

            SHA="${{ github.sha }}"
            IMAGE_TAR="/tmp/image.tar"
            DEPLOY_DIR="/srv/docimal-admin"
            IMAGE_TAR_PATH="$DEPLOY_DIR/image.tar"
            IMAGE_NAME="docimal-admin"
            CONTAINER_NAME="docimal-admin"
            TARGET_PORT=2999

            echo "Deploy start: SHA=$SHA"
            mkdir -p "$DEPLOY_DIR"

            # Clean up existing tar
            if [ -e "$IMAGE_TAR_PATH" ]; then
              rm -rf "$IMAGE_TAR_PATH"
            fi

            # Move uploaded tar into deploy dir
            if [ -f "$IMAGE_TAR" ]; then
              mv "$IMAGE_TAR" "$IMAGE_TAR_PATH"
            else
              echo "ERROR: expected $IMAGE_TAR to be a file."
              ls -la /tmp || true
              exit 1
            fi

            # Write .env from secrets for reference on server
            cat > "$DEPLOY_DIR/.env" <<'ENV'
            ${{ secrets.ADMIN_ENV }}
            ENV
            chmod 600 "$DEPLOY_DIR/.env"

            echo "Loading docker image from $IMAGE_TAR_PATH ..."
            docker load -i "$IMAGE_TAR_PATH"

            # Remove tar after load
            rm -f "$IMAGE_TAR_PATH" || true

            echo "Replacing container $CONTAINER_NAME ..."
            docker rm -f $CONTAINER_NAME || true

            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p 127.0.0.1:${TARGET_PORT}:${TARGET_PORT} \
              $IMAGE_NAME:${SHA}

            echo "Deployed image $IMAGE_NAME:${SHA} and running on 127.0.0.1:${TARGET_PORT}"
